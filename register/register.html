<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9F9F9; 
        }
    </style>
</head>
<body class="flex  items-center justify-center min-h-screen p-4 sm:p-8">
    
    <!--main content-->
    <div >
        <div max-w-[390px] w-full h-screen sm:h-auto sm:min-h-[844px] bg-[#f9fafb] 
            flex flex-col relative mx-auto sm:shadow-2xl sm:rounded-[3rem] sm:border-[8px] sm:border-gray-900 overflow-hidden>
            <h1 class="text2xl font-semibold text-grey-900 mb-2 tracking-light ">What's your email?</h1>
            <p class="text-sm text-grey-500 mb-8 leading-relaxed pr-4">
                Enter your email and join the reading adventure. No one will see this on your profile.
            </p>

            <div class="mb-2 realtive">
                <input 
                type="email"
                placeholder="Email"
                class="w-full p-3 bg-white border border-grey-300 rounded-xl 
                text-[15px] focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400 
                placeholder-gray-400 text-gray-900 transition-colors">
            </div>
            
            <!--primary button-->
            <button class="w-full bg-[#df3b3b] hover:bg-[#c93333] text-white font-semibold text-[15px] p-3
            rounded-xl mt-4 transition-colors shadow-sm">
                Sign up 
            </button>
            <!--secondary button-->
            <button class="w-full bg-white border border-gray-300 text-grey-700 font-semibold text-[15px]
            p-3 rounded-xl mt-3 hover:border-gray-50 transition-colors">
                Sign up with phone number
            </button>
        </div>

        <!--Footer-->
        <div class="mt-auto px-6 pb-2 pt-6 flex flex-col items-center">
            <p class="text-[14px] text-gray-500 mb-10">
                Already have an account?
                <a href="#" class="text-[#df3b3b] font- bold hover:underline ml-0.5">Log in</a>
            </p>
        </div>
    </div>

     <script>
        lucide.createIcons();
    </script>
</body>
</html>
