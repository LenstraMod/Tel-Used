<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register-Tel-Used</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
    <!-- Pembagian menjadi dua, sisi kiri untuk design dan sisi kanan untuk form -->
    <main>
        <!-- Section Kiri -->
        <section>
            <!-- ini masih kosong, kemungkinan nanti dikerjakan ketika pengembangan css, atau masukan img saja <img>-->
        </section>
        <!-- Section Kanan -->
        <section>
            <h1>Register</h1>
            <p>Kamu belum punya akun? Buat akun kamu sekarang! <br> hanya membutuhkan waktu kurang dari semenit.</p>
            <form action="new-pw.html" method="post">
                <div>
                    <label for="nama"><strong>Nama</strong></label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>
                </div>
                <div>
                    <label for="email"><strong>Email</strong></label>
                    <input type="text" name="email" id="email" placeholder="Masukkan Email Anda" required>
                </div>
                <div>
                    <label for="nomor-telepon"><strong>Nomor Telepon</strong></label>
                    <input type="text" name="nomor-telepon" id="nomor-telepon" placeholder="Masukkan No Telepon Anda" required>
                </div>
                <button type="submit">
                    Berikutnya
                </button>
            </form>
            <p>Sudah punya akun?<a href="login.html"><strong>Masuk</strong></a></p>
        </section>
    </main>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
